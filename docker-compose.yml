version: "3.8"

services:
   rabbitmq:
      image: "rabbitmq:3-management"
      container_name: rabbitmq
      ports:
         - "5672:5672"
         - "15672:15672"
      healthcheck:
         test: ["CMD", "rabbitmqctl", "status"]
         interval: 10s
         timeout: 5s
         retries: 5
      networks:
         - mynetwork

   keycloak:
      image: quay.io/keycloak/keycloak:24.0.3
      container_name: keycloak
      command: start-dev --import-realm --verbose
      volumes:
         - ./keycloak-realm:/opt/keycloak/data/import
         - ./keycloak-event-listener/event-listener-http-jar-with-dependencies.jar:/opt/keycloak/providers/event-listener-http.jar
      environment:
         KC_DB: ${KC_DB}
         KC_DB_URL: ${KC_DB_URL}
         KC_DB_USERNAME: ${KC_DB_USERNAME}
         KC_DB_PASSWORD: ${KC_DB_PASSWORD}
         KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
         KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
         KEYCLOAK_HTTP_ENABLED: true
         KEYCLOAK_DB_URL: ${KC_DB_URL}
         KC_SPI_EVENTS_LISTENER_PROVIDERS: +http
         KC_EVENTS_LISTENERS: http
      ports:
         - "8080:8080"
      networks:
         - mynetwork

   notification:
      build:
         context: .
         dockerfile: notification/Dockerfile
      container_name: notificationservice
      depends_on:
         rabbitmq:
            condition: service_healthy
      environment:
         RABBITMQ_HOST: ${RABBITMQ_HOST}
         SQLSERVER__ConnectionString: ${SQLSERVER_CONNECTIONSTRING}
      ports:
         - "8002:8000"
      networks:
         - mynetwork

   user:
      build:
         context: ./user
         dockerfile: Dockerfile
      container_name: userservice
      depends_on:
         rabbitmq:
            condition: service_healthy
         keycloak:
            condition: service_started
      environment:
         MongoDB__ConnectionString: ${MONGODB_CONNECTIONSTRING}
         MongoDB__DatabaseName: ${MONGODB_DATABASENAME}
         RABBITMQ_HOST: ${RABBITMQ_HOST}
         KEYCLOAK_URL: ${KEYCLOAK_URL}
         KEYCLOAK_REALM: ${KEYCLOAK_REALM}
         KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
         KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
         ASPNETCORE_ENVIRONMENT: Development
         ConnectionStrings__DefaultConnection: ${DEFAULT_CONNECTION_STRING}
      ports:
         - "8008:8080"
      networks:
         - mynetwork

   appointment:
      build:
         context: .
         dockerfile: appointment/Dockerfile
      container_name: appointmentservice
      depends_on:
         rabbitmq:
            condition: service_healthy
      environment:
         RABBITMQ_HOST: ${RABBITMQ_HOST}
         MongoDB__ConnectionString: ${MONGODB_APPOINTMENT}
         MongoDB__AppointmentDBName: ${MONGODB_APPOINTMENT_DB}
         MongoDB__SlotDBName: ${MONGODB_SLOT_DB}
      ports:
         - "8004:8000"
      networks:
         - mynetwork

   payment:
      build:
         context: ./payment/paymentDemo
         dockerfile: Dockerfile
      container_name: paymentservice
      depends_on:
         rabbitmq:
            condition: service_healthy
      environment:
         RABBITMQ_HOST: ${RABBITMQ_HOST}
      ports:
         - "8006:8080"
      networks:
         - mynetwork

networks:
   mynetwork:
      driver: bridge

volumes:
   mysql_data:
